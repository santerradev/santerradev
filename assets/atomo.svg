<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300"><style>.st{fill:#fff;animation:tw 3s ease-in-out infinite}.d1{animation-delay:.8s}.d2{animation-delay:1.6s}.d3{animation-delay:2.3s}@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}.at{transform-origin:150px 150px;animation:sp 20s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.nu{transform-origin:150px 150px;animation:pl 2s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.2)}}</style><rect width="300" height="300" fill="#000"/><circle class="st d0" cx="30" cy="35" r="1.1"/><circle class="st d1" cx="270" cy="40" r="1.3"/><circle class="st d2" cx="35" cy="270" r="1"/><circle class="st d3" cx="265" cy="265" r="1.2"/><circle class="st d0" cx="150" cy="20" r="0.8"/><g class="at"><g transform="rotate(0 150 150)"><path d="M60 150 a90 32 0 1 0 180 0 a90 32 0 1 0 -180 0" stroke="#666" stroke-width="2" fill="none"/><circle r="7" fill="#fff"><animateMotion dur="2.4s" repeatCount="indefinite" path="M60 150 a90 32 0 1 0 180 0 a90 32 0 1 0 -180 0"/></circle></g><g transform="rotate(60 150 150)"><path d="M60 150 a90 32 0 1 0 180 0 a90 32 0 1 0 -180 0" stroke="#666" stroke-width="2" fill="none"/><circle r="7" fill="#fff"><animateMotion dur="2.9s" repeatCount="indefinite" path="M60 150 a90 32 0 1 0 180 0 a90 32 0 1 0 -180 0"/></circle></g><g transform="rotate(120 150 150)"><path d="M60 150 a90 32 0 1 0 180 0 a90 32 0 1 0 -180 0" stroke="#666" stroke-width="2" fill="none"/><circle r="7" fill="#fff"><animateMotion dur="3.4s" repeatCount="indefinite" path="M60 150 a90 32 0 1 0 180 0 a90 32 0 1 0 -180 0"/></circle></g></g><circle class="nu" cx="150" cy="150" r="14" fill="#fff"/><circle cx="150" cy="150" r="24" fill="#fff" opacity=".1"/></svg>
