<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <style>
    .star { fill: #fff; animation: twinkle 3s ease-in-out infinite; }
    .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; } .s4 { animation-delay: 2.3s; }
    @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    .astro { transform-origin: 150px 150px; animation: float 6s ease-in-out infinite; }
    @keyframes float {
      0%   { transform: translate(0px, 0px) rotate(-8deg); }
      50%  { transform: translate(6px, -14px) rotate(8deg); }
      100% { transform: translate(0px, 0px) rotate(-8deg); }
    }
  </style>

  <rect width="300" height="300" fill="#000"/>

  <!-- estrelas -->
  <circle class="star" cx="30" cy="40" r="1.2"/>
  <circle class="star s2" cx="260" cy="30" r="1.5"/>
  <circle class="star s3" cx="70" cy="250" r="1"/>
  <circle class="star s4" cx="240" cy="230" r="1.3"/>
  <circle class="star s2" cx="200" cy="80" r=".9"/>
  <circle class="star s3" cx="45" cy="150" r="1.1"/>
  <circle class="star" cx="275" cy="150" r="1"/>
  <circle class="star s4" cx="120" cy="25" r=".8"/>
  <circle class="star s3" cx="160" cy="275" r="1.2"/>

  <g class="astro">
    <!-- mochila -->
    <rect x="118" y="132" width="64" height="66" rx="12" fill="#9a9a9a"/>
    <!-- braço esquerdo (acenando) -->
    <path d="M128 150 Q100 135 96 108" stroke="#e6e6e6" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="96" cy="104" r="9" fill="#cfcfcf"/>
    <!-- braço direito -->
    <path d="M172 150 Q198 160 206 182" stroke="#e6e6e6" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="207" cy="186" r="9" fill="#cfcfcf"/>
    <!-- pernas -->
    <path d="M138 196 Q132 220 120 236" stroke="#e6e6e6" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M162 196 Q172 220 188 230" stroke="#e6e6e6" stroke-width="18" stroke-linecap="round" fill="none"/>
    <rect x="106" y="232" width="24" height="12" rx="5" fill="#bdbdbd" transform="rotate(20 118 238)"/>
    <rect x="180" y="226" width="24" height="12" rx="5" fill="#bdbdbd" transform="rotate(-25 192 232)"/>
    <!-- corpo -->
    <rect x="126" y="138" width="48" height="64" rx="16" fill="#f2f2f2"/>
    <rect x="138" y="158" width="24" height="16" rx="3" fill="#bdbdbd"/>
    <circle cx="144" cy="166" r="2.5" fill="#555"/>
    <circle cx="153" cy="166" r="2.5" fill="#fff"/>
    <!-- capacete -->
    <circle cx="150" cy="112" r="32" fill="#f7f7f7"/>
    <ellipse cx="152" cy="113" rx="22" ry="18" fill="#1a1a1a"/>
    <ellipse cx="144" cy="105" rx="7" ry="4" fill="#ffffff" opacity=".6" transform="rotate(-25 144 105)"/>
    <rect x="178" y="104" width="8" height="14" rx="3" fill="#cfcfcf"/>
  </g>
</svg>
