<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c9c9c"/>
      <stop offset=".55" stop-color="#e9e9e9"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="d1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="d2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="rio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#bdbdbd" stop-opacity=".9"/>
    </linearGradient>
    <style>
      .t { font-family: 'Courier New', Consolas, monospace; fill: #2a2a2a; }
      .cursor { animation: pisca 1s steps(1) infinite; }
      @keyframes pisca { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="380" fill="url(#ceu)"/>

  <!-- dunas ao fundo -->
  <path d="M0 250 C 150 215, 260 230, 380 240 S 620 205, 760 232 S 1020 215, 1200 238 L1200 380 L0 380 Z" fill="#6a6a6a" opacity=".55"/>
  <!-- dunas médias -->
  <path d="M0 275 C 120 245, 240 250, 360 268 S 600 250, 720 262 S 980 240, 1200 266 L1200 380 L0 380 Z" fill="url(#d1)"/>
  <!-- rio serpenteando -->
  <path d="M640 266 C 610 285, 700 295, 640 312 S 520 330, 600 352 S 760 370, 700 380 L 760 380 C 830 360, 660 345, 690 330 S 760 300, 680 290 S 660 272, 650 266 Z" fill="url(#rio)"/>
  <!-- dunas da frente -->
  <path d="M0 310 C 160 285, 300 300, 470 330 S 560 380, 560 380 L0 380 Z" fill="url(#d2)"/>
  <path d="M1200 300 C 1040 290, 900 310, 800 340 S 740 380, 740 380 L1200 380 Z" fill="url(#d2)"/>

  <!-- texto -->
  <text class="t" x="600" y="118" text-anchor="middle" font-size="40">Bem-vindo ao GitHub do Antonio</text>
  <text class="t" x="600" y="168" text-anchor="middle" font-size="32">&lt;/&gt;<tspan class="cursor">_</tspan></text>
</svg>
